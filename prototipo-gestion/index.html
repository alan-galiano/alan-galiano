<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Difilippo Gas — Gestión diaria (prototipo)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Titillium+Web:ital,wght@1,700&display=swap">
<style>
:root{
  --marca-rojo:#E30613; --marca-azul:#1F3C88;
  --amarillo:#F6E606; --negro:#141414; --fondo:#f4f4f0; --card:#fff; --texto:#1b1b1b;
  --suave:#666; --borde:#e2e2db; --verde:#1d7a3a; --verde-bg:#e7f4ec; --rojo:#b3261e; --rojo-bg:#fbeaea;
  --radio:14px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Montserrat',system-ui,sans-serif;background:var(--fondo);color:var(--texto);font-size:16px;line-height:1.4}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:flex;min-height:100vh}
/* Navegación */
.nav{width:220px;background:#000;color:#fff;padding:20px 12px;position:sticky;top:0;height:100vh;flex-shrink:0;display:flex;flex-direction:column;gap:4px}
.marca{font-weight:800;font-size:18px;padding:4px 12px 18px;line-height:1.2}
.marca small{display:block;font-weight:500;font-size:12px;color:#aaa;margin-top:4px}
.marca b{color:var(--amarillo)}
.nav a{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:10px;color:#ddd;text-decoration:none;font-weight:600}
.nav a:hover{background:#262626;color:#fff}
.nav a.activo{background:var(--amarillo);color:var(--negro)}
.nav .ico{font-size:20px;width:24px;text-align:center}
.nav .pie-nav{margin-top:auto;font-size:11px;color:#888;padding:12px}
.col{flex:1;min-width:0}
.top{background:#000;border-bottom:1px solid #000;position:relative;padding:10px 32px 8px;display:flex;align-items:center;gap:16px}
.top::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:linear-gradient(90deg,var(--marca-rojo) 0 34%,var(--marca-azul) 34% 67%,var(--amarillo) 67%)}
.top .logo{display:flex;align-items:center;gap:12px;text-decoration:none;margin-top:4px}
.top .logo-img{height:86px;width:auto;display:block}
.palabra{display:flex;flex-direction:column;line-height:.9;font-family:'Titillium Web',sans-serif}
.palabra .d{font-weight:700;font-style:italic;font-size:34px;color:var(--marca-rojo);letter-spacing:-1px}
.palabra .g{font-weight:700;font-style:italic;font-size:17px;color:var(--marca-azul);align-self:flex-end;letter-spacing:1px;margin-top:2px}
.top .der{margin-left:auto;text-align:right;font-size:13px;color:#bbb;margin-top:4px}
.top .der b{display:block;color:#fff;font-size:15px}
main{padding:28px 32px 60px;max-width:1200px;min-width:0}
h1{border-left:5px solid var(--marca-rojo);padding-left:12px}
.paso i{background:var(--marca-azul)!important;color:#fff!important}
.marca .mini{display:flex;align-items:center;gap:8px;font-family:'Titillium Web',sans-serif;font-style:italic;font-weight:700;font-size:21px}
.marca .mini svg{height:26px;width:auto}
h1{font-size:26px;margin:0 0 4px;font-weight:800}
h2{font-size:18px;margin:0 0 14px;font-weight:700}
.sub{color:var(--suave);margin:0 0 22px}
.card{background:var(--card);border:1px solid var(--borde);border-radius:var(--radio);padding:20px;margin-bottom:18px}
.grid2{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px;align-items:start}
.fila{display:flex;gap:12px;flex-wrap:wrap;align-items:end}
.fila>*{flex:1;min-width:150px}
label.campo{display:block;font-size:13px;font-weight:600;color:var(--suave);margin-bottom:6px}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=search],select,textarea{width:100%;padding:12px 14px;border:1.5px solid var(--borde);border-radius:10px;background:#fff;font-size:16px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--negro);box-shadow:0 0 0 3px rgba(246,230,6,.55)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:10px;border:1.5px solid var(--borde);background:#fff;font-weight:700;cursor:pointer;text-decoration:none;color:var(--texto)}
.btn:hover{border-color:var(--negro)}
.btn.prim{background:var(--negro);color:#fff;border-color:var(--negro)}
.btn.prim:hover{background:#000}
.btn.grande{padding:18px 22px;font-size:18px;width:100%}
.btn.chico{padding:7px 12px;font-size:14px}
.btn.peligro{color:var(--rojo)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:10px 16px;border-radius:999px;border:1.5px solid var(--borde);background:#fff;font-weight:600;cursor:pointer}
.chip.on{background:var(--amarillo);border-color:var(--negro);color:var(--negro)}
.muted{color:var(--suave)}
.tabla{width:100%;border-collapse:collapse;font-size:15px}
.tabla th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--suave);font-weight:700;padding:8px 10px;border-bottom:1.5px solid var(--borde)}
.tabla td{padding:10px;border-bottom:1px solid var(--borde);vertical-align:middle}
.tabla tr:last-child td{border-bottom:none}
.tabla .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tabla tfoot td{font-weight:800;border-top:1.5px solid var(--borde)}
.tabla input{padding:8px 10px;font-size:15px}
.x{border:none;background:none;cursor:pointer;color:#999;font-size:18px;padding:4px 8px;border-radius:6px}
.x:hover{background:var(--rojo-bg);color:var(--rojo)}
.vacio{color:var(--suave);text-align:center;padding:22px 10px}
.aviso{background:#fffbd1;border:1px solid #e9dc5a;border-radius:10px;padding:10px 14px;font-size:14px;margin-bottom:18px}
/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--borde);border-radius:var(--radio);padding:16px 18px}
.kpi .k{font-size:13px;color:var(--suave);font-weight:600}
.kpi .v{font-size:clamp(19px,1.9vw,26px);white-space:nowrap;font-weight:800;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi.dest{background:var(--negro);color:#fff;border-color:var(--negro)}
.kpi.dest .k{color:#bbb}
.kpi.dest .v{color:var(--amarillo)}
/* Acciones inicio */
.acciones{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:22px}
.accion{display:block;background:var(--card);border:1.5px solid var(--borde);border-radius:var(--radio);padding:22px;text-decoration:none;color:var(--texto)}
.accion:hover{border-color:var(--negro);box-shadow:0 4px 0 var(--amarillo)}
.accion .ico{font-size:34px}
.accion b{display:block;font-size:19px;margin-top:8px}
.accion span{font-size:14px;color:var(--suave)}
/* Ventas */
.buscador{position:relative}
.sugerencias{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:#fff;border:1.5px solid var(--negro);border-radius:10px;z-index:20;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.12)}
.sug{padding:11px 14px;cursor:pointer;border-bottom:1px solid var(--borde)}
.sug:last-child{border-bottom:none}
.sug small{display:block;color:var(--suave);font-size:13px}
.sug.sel,.sug:hover{background:#fffbd1}
.sug.nuevo{font-weight:700}
.cliente-sel{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#fffbd1;border:1.5px solid var(--negro);border-radius:10px;padding:12px 14px}
.cliente-sel b{font-size:18px}
.prods{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.prod{border:1.5px solid var(--borde);border-radius:12px;padding:12px;background:#fff;text-align:center;user-select:none}
.prod.on{border-color:var(--negro);background:#fffbd1}
.prod .n{font-weight:700;font-size:15px;min-height:2.6em;display:flex;align-items:center;justify-content:center}
.prod .p{font-size:13px;color:var(--suave);margin-bottom:8px}
.stepper{display:flex;align-items:center;justify-content:center;gap:6px}
.stepper button{width:40px;height:40px;border-radius:10px;border:1.5px solid var(--borde);background:#fff;font-size:22px;font-weight:700;cursor:pointer;line-height:1}
.stepper button:hover{border-color:var(--negro)}
.stepper .c{min-width:34px;font-size:22px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums}
.total-venta{display:flex;justify-content:space-between;align-items:center;font-size:15px;padding:14px 0 16px}
.total-venta b{font-size:32px;font-variant-numeric:tabular-nums}
.paso{display:flex;align-items:center;gap:10px;margin:18px 0 10px;font-weight:700}
.paso:first-child{margin-top:0}
.paso i{font-style:normal;background:var(--negro);color:var(--amarillo);width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:14px}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:3px 8px;border-radius:6px;background:#eee}
.tag.Efectivo{background:var(--verde-bg);color:var(--verde)}
.tag.Transferencia{background:#e6eefb;color:#1f4fa3}
.tag.CtaCte{background:var(--rojo-bg);color:var(--rojo)}
.tag.QR{background:#e8f7f6;color:#0b6e69}
.tag.Cheque{background:#f1ecfb;color:#5b2aa3}
.tag.Mixto{background:#fff1d6;color:#8a5300}
.mixto,.cheque{background:#fafaf6;border:1px dashed var(--borde);border-radius:10px;padding:12px;margin-top:12px}
.mixto input{font-size:17px;font-weight:700;text-align:right}
/* Toast y modal */
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:50;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:var(--negro);color:#fff;padding:14px 18px;border-radius:12px;display:flex;gap:16px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.25);font-weight:600}
.toast button{background:var(--amarillo);color:var(--negro);border:none;border-radius:8px;padding:7px 12px;font-weight:800;cursor:pointer}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:60;padding:20px}
.modal.hidden{display:none}
.modal .caja{background:#fff;border-radius:16px;padding:24px;max-width:520px;width:100%}
.modal textarea{height:200px;font-family:monospace;font-size:12px}
.seccion-tit{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.seccion-tit h2{margin:0}
.cod{display:inline-block;font-family:ui-monospace,Menlo,Consolas,monospace;background:var(--negro);color:var(--amarillo);padding:1px 7px;border-radius:6px;font-weight:700;font-size:13px;vertical-align:1px}
.tag.cat-comercio{background:#e6eefb;color:#1f4fa3}
.tag.cat-gastro{background:#ffe9e0;color:#a33a12}
.tag.cat-subdist{background:#efe6fb;color:#5b2aa3}
.tag.cat-esp{background:#ffe9d6;color:#9a4a00}
.deuda{color:var(--rojo);font-weight:800}
.haber{color:var(--verde)}
.rec{background:#fff;border-left:4px solid var(--amarillo);padding:6px 10px;margin-top:6px;font-size:14px;border-radius:6px}
.recrow{display:flex;gap:12px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--borde)}
.recrow:last-child{border-bottom:none}
.recrow.hecho .txt{text-decoration:line-through;color:#999}
.recrow.alerta{background:var(--rojo-bg);border-radius:10px;padding:12px;border:none;margin-top:6px}
.check{width:30px;height:30px;flex-shrink:0;border-radius:8px;border:2px solid var(--negro);background:#fff;cursor:pointer;font-weight:900;color:var(--verde);font-size:16px}
.check:hover{background:#fffbd1}
.link{color:inherit;text-decoration:none;font-size:14px}
.link:hover{text-decoration:underline}
tr.anulada td{color:#9a9a9a}
tr.anulada td b,tr.anulada td .num{text-decoration:line-through}
tr.click{cursor:pointer}
tr.click:hover td{background:#fffbd1}
.precio-ed{display:inline-flex;align-items:center;gap:2px;font-size:14px;color:var(--suave)}
.precio-ed input{width:92px;padding:4px 6px;font-size:15px;font-weight:700;text-align:right;border-style:dashed}
.nota-pr{margin-top:4px;min-height:20px}
.stepper input.c{width:58px;text-align:center;font-size:20px;font-weight:800;padding:6px 4px}
.vehs{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.veh{border:1.5px solid var(--borde);border-radius:14px;padding:16px;background:#fff}
.veh-tit{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:17px}
.veh-odo{font-size:30px;font-weight:800;margin-top:8px;font-variant-numeric:tabular-nums}
.veh-datos{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.veh-datos>div{background:#fafaf6;border-radius:10px;padding:10px 12px}
.veh-datos span{display:block;font-size:12px;color:var(--suave);font-weight:600}
.veh-datos b{display:block;font-size:20px;margin-top:2px;font-variant-numeric:tabular-nums}
.veh-datos small{display:block;font-size:12px;color:var(--suave);margin-top:2px}
.grupo-dup{border:1.5px solid var(--borde);border-radius:12px;padding:12px;margin-bottom:12px}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tabla-stock{min-width:760px}
.tabla-stock th,.tabla-stock td{text-align:center;padding:6px 4px}
.tabla-stock th:first-child,.tabla-stock td:first-child{text-align:left;padding-left:8px}
.tabla-stock input{width:66px;text-align:right;padding:7px 8px;font-size:15px}
.tabla-stock .grupo{border-left:2px solid var(--borde)}
.tabla-stock tfoot td{text-align:center}
.tabla-stock .ll{background:#fcfbe8}
.badge-ok{display:inline-block;font-weight:800;color:var(--verde);background:var(--verde-bg);padding:4px 10px;border-radius:8px}
.badge-mal{display:inline-block;font-weight:800;color:var(--rojo);background:var(--rojo-bg);padding:4px 10px;border-radius:8px}
.barra{height:10px;background:#eee;border-radius:99px;overflow:hidden;margin-top:8px}
.barra i{display:block;height:100%;background:var(--negro)}
.cuenta td.debe{color:var(--rojo)}
.cuenta td.haber{color:var(--verde)}
.mesnav{display:flex;align-items:center;gap:8px}
.mesnav b{min-width:150px;text-align:center}
.cant4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.cant4 input{text-align:center;font-size:18px;font-weight:700}
.calc{background:#fafaf6;border:1px dashed var(--borde);border-radius:10px;padding:12px 14px;margin-top:14px;font-size:15px}
.calc div{display:flex;justify-content:space-between;padding:2px 0}
.calc .tot{font-weight:800;font-size:20px;border-top:1px solid var(--borde);margin-top:6px;padding-top:8px}
@media (max-width:900px){
  .grid2{grid-template-columns:1fr}
  .acciones{grid-template-columns:1fr}
}
@media (max-width:760px){
  .app{display:block}
  .nav{position:fixed;bottom:0;left:0;right:0;top:auto;width:auto;height:auto;flex-direction:row;padding:6px;z-index:40;justify-content:space-around;gap:0}
  .marca,.nav .pie-nav{display:none}
  .nav a{flex-direction:column;gap:2px;padding:6px 1px;font-size:9.5px;flex:1;text-align:center;letter-spacing:-.2px}
  .nav .ico{font-size:18px;width:auto}
  .cant4{grid-template-columns:repeat(2,1fr)}
  main{padding:18px 14px 100px}
  .top{padding:10px 14px}
  .top .logo-img{height:62px}
  .palabra .d{font-size:24px}
  .top .der{display:none}
  h1{font-size:22px}
  .card{padding:16px}
  .tabla{font-size:14px}
  .tabla td,.tabla th{padding:8px 6px}
  .ocultar-movil{display:none}
}
</style>
</head>
<body>
<div class="app">
  <nav class="nav" id="nav"></nav>
  <div class="col">
    <header class="top" id="top"></header>
    <main id="main"></main>
  </div>
</div>
<div id="toast"></div>
<div id="modal" class="modal hidden"></div>

<script>
/* ===================== Utilidades ===================== */
const KEY = 'gestion-gas-prototipo-v1';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => '$ ' + Math.round(n || 0).toLocaleString('es-AR');
const pad = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const hoy = () => ymd(new Date());
const addDays = (s, k) => { const d = new Date(s + 'T12:00:00'); d.setDate(d.getDate() + k); return ymd(d); };
const fmtFecha = s => new Date(s + 'T12:00:00').toLocaleDateString('es-AR', {weekday:'short', day:'numeric', month:'short'});
const fmtLarga = s => new Date(s + 'T12:00:00').toLocaleDateString('es-AR', {weekday:'long', day:'numeric', month:'long', year:'numeric'});
const mesDe = s => s.slice(0, 7);
const nombreMes = m => new Date(m + '-15T12:00:00').toLocaleDateString('es-AR', {month:'long', year:'numeric'});
let uidN = Date.now();
const nid = () => (uidN++).toString(36);
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
const horasEntre = (a, b) => {
  if (!a || !b) return 0;
  const [h1, m1] = a.split(':').map(Number), [h2, m2] = b.split(':').map(Number);
  let min = (h2 * 60 + m2) - (h1 * 60 + m1);
  if (min < 0) min += 24 * 60;
  return min / 60;
};
const fmtHoras = h => { const t = Math.round(h * 60); return Math.floor(t / 60) + ' h' + (t % 60 ? ' ' + pad(t % 60) + ' min' : ''); };

/* ===================== Datos de ejemplo ===================== */

    ].map(([codigo, nombre, dir, tel, categoria]) => ({id: nid(), codigo, nombre, dir, tel, categoria, saldoInicial:0, limite:0, precios:{}})),
    productos: [
      {id:'g10', nombre:'Garrafa 10 kg', precio:32990, costo:8652, envase:true},

// Lo que una venta deja en cuenta corriente (negativo = pagó de más y descuenta deuda)
function ccDe(v) { return v.cc != null ? v.cc : (v.pago === 'CtaCte' ? v.total : 0); }
function pagosDe(v) { return v.pagos || (v.pago === 'CtaCte' ? [] : [{medio:v.pago, monto:v.total}]); }
function pagosTxt(v) {
  const p = pagosDe(v).map(x => x.medio + ' ' + money(x.monto)), cc = ccDe(v);
  if (cc > 0) p.push('Cta. cte. ' + money(cc));
  return p.join(' + ');
}

function migrar(S) {
  // Antes había listas de precios por tipo: se pasan a cada cliente y se borran
  if (S.listas) {
    S.clientes.forEach(c => { c.precios ||= {}; const l = S.listas[c.categoria] || {}; Object.entries(l).forEach(([k, v]) => { if (!(num(c.precios[k]) > 0) && num(v) > 0) c.precios[k] = num(v); }); });
    delete S.listas;
  }
  const costoProv = {g10:'10', g15:'15', g45:'45', c15:'c15'};
  S.productos.forEach(p => { if (p.costo == null) p.costo = S.proveedor && costoProv[p.id] ? Math.round(num(S.proveedor.precios[costoProv[p.id]]) * (1 + num(S.proveedor.impuesto) / 100)) : 0; });
  S.clientes.forEach((c, i) => {
    if (c.codigo == null) c.codigo = 101 + i;
    c.categoria ||= 'final'; c.precios ||= {};
    if (c.saldoInicial == null) c.saldoInicial = 0;
    if (c.limite == null) c.limite = 0;
  });
  S.cobros ||= []; S.recordatorios ||= [];
  if (S.ejemplo === undefined) S.ejemplo = S.clientes.some(c => c.nombre === 'Panadería La Espiga');
  S.ventas.forEach((v, i) => { if (!v.nro) v.nro = i + 1; if (!v.pagos) { v.pagos = pagosDe(v); v.cc = ccDe(v); } });
  S.seq ||= {venta:0, cobro:0};
  S.seq.venta = Math.max(S.seq.venta, ...S.ventas.map(v => v.nro), 0);

function ir() {

  actual = VISTAS[h] ? h : 'inicio';
  if (actual === 'clientes' && !C.abrir) { C.sel = null; C.modo = 'lista'; }

  $('#toast').innerHTML = '';
  renderNav();
  VISTAS[actual]();
  window.scrollTo(0, 0);
}

/* ===================== Clientes: funciones ===================== */
const catNombre = id => (CATS.find(c => c.id === id) || CATS[3]).nombre;
const tagCat = c => c.categoria === 'final' ? '' : `<span class="tag cat-${c.categoria}">${catNombre(c.categoria)}</span>`;
const ventasOk = () => S.ventas.filter(v => !v.anulada);
function origenPrecio(c, pid) {
  const p = prod(pid); if (!p) return {pr:0};
  if (c && num(c.precios?.[pid]) > 0) return {pr:num(c.precios[pid]), de:'cliente'};
  return {pr:p.precio, de:'sugerido'};
}
function precioPara(c, pid) { return origenPrecio(c, pid).pr; }
function saldoCliente(id) {
  const c = cli(id);
  return num(c?.saldoInicial)
    + S.ventas.filter(v => !v.anulada && v.cliente === id).reduce((a, v) => a + ccDe(v), 0)
    - S.cobros.filter(x => !x.anulado && x.cliente === id).reduce((a, x) => a + x.monto, 0);
}
const ultimoCobro = id => S.cobros.filter(x => !x.anulado && x.cliente === id).sort((a, b) => b.fecha.localeCompare(a.fecha))[0];
function buscarClientes(q, lim) {
  const qq = q.trim(), toks = norm(qq).split(/\s+/).filter(Boolean);
  if (!toks.length) return [];
  const res = S.clientes.filter(c => {
    const h = norm(c.codigo + ' ' + (c.viejos || []).join(' ') + ' ' + c.nombre + ' ' + (c.dir || '') + ' ' + (c.tel || '') + ' ' + catNombre(c.categoria));
    return toks.every(t => h.includes(t));
  });
  const exacto = c => String(c.codigo) === qq || (c.viejos || []).some(v => String(v) === qq);
  res.sort((a, b) => exacto(b) - exacto(a) || (norm(b.nombre).startsWith(toks[0])) - (norm(a.nombre).startsWith(toks[0])) || a.nombre.localeCompare(b.nombre));
  return lim ? res.slice(0, lim) : res;
}
const sigCodigo = () => Math.max(100, ...S.clientes.map(c => num(c.codigo))) + 1;
function copiarTexto(txt, ok) {
  const fb = () => {
    const m = modal('<h2>Copiá este texto</h2><p class="muted">Seleccioná todo (Ctrl+A), copiá (Ctrl+C) y pegalo donde quieras.</p><textarea readonly></textarea><div style="margin-top:14px"><button class="btn prim" id="mOk">Listo</button></div>');
    const ta = m.querySelector('textarea'); ta.value = txt; ta.focus(); ta.select();
    m.querySelector('#mOk').onclick = cerrarModal;
  };
  try { navigator.clipboard.writeText(txt).then(() => toast(ok), fb); } catch (e) { fb(); }
}
function pedirAnulacion(titulo, fn) {
  const m = modal(`<h2>${esc(titulo)}</h2><p class="muted">No se borra: queda registrado como anulado, así no se pierde ningún número.</p>
    <label class="campo">Motivo (opcional)</label><input type="text" id="aM" placeholder="Ej: se cargó dos veces">
    <div class="fila" style="margin-top:18px"><button class="btn" id="aNo">Cancelar</button><button class="btn prim" id="aSi">Anular</button></div>`);
  m.querySelector('#aM').focus();
  m.querySelector('#aNo').onclick = cerrarModal;
  m.querySelector('#aSi').onclick = () => { const mot = m.querySelector('#aM').value.trim(); cerrarModal(); fn({fecha:hoy(), motivo:mot}); };
}
function chequeHTML(ch) {
  return `<div class="cheque"><div class="muted" style="font-size:13px;font-weight:700;margin-bottom:6px">🧾 Datos del cheque</div><div class="fila">
    <div><label class="campo">N° de cheque</label><input type="text" data-ch="nro" value="${esc(ch.nro || '')}" inputmode="numeric"></div>
    <div><label class="campo">Banco</label><input type="text" data-ch="banco" value="${esc(ch.banco || '')}"></div>
    <div><label class="campo">Fecha de cobro</label><input type="date" data-ch="fecha" value="${ch.fecha || ''}"></div></div></div>`;
}
function leerCheque(box) { const o = {}; box.querySelectorAll('[data-ch]').forEach(i => o[i.dataset.ch] = i.value.trim()); return o; }
function recordarCheque(ch, monto, cid) {
  if (!ch?.fecha) return null;
  const r = {id:nid(), fecha:ch.fecha, cliente:cid, texto:`Depositar cheque${ch.nro ? ' N° ' + ch.nro : ''}${ch.banco ? ' (' + ch.banco + ')' : ''} de ${money(monto)}`, hecho:false};
  S.recordatorios.push(r); return r;
}
function registrarCobro(cid, despues) {
  const c = cli(cid), s = saldoCliente(cid);
  const m = modal(`<h2>💵 Cobro a ${esc(c.nombre)}</h2><p class="muted" style="margin-top:0">${s > 0 ? 'Debe ' + money(s) : 'No tiene deuda'}</p>

/* ===================== Recordatorios ===================== */
function cuandoTxt(f) {
  const d = Math.round((new Date(f + 'T12:00:00') - new Date(hoy() + 'T12:00:00')) / 864e5);
  if (d < 0) return `<span class="badge-mal" style="font-size:12px">Venció hace ${-d} día${d === -1 ? '' : 's'}</span>`;
  if (d === 0) return '<span class="tag" style="background:var(--amarillo)">Hoy</span>';
  if (d === 1) return '<span class="tag">Mañana</span>';
  return `<span class="tag">${esc(fmtFecha(f))}</span>`;
}
function filaRec(r, conCliente) {
  const c = r.cliente && cli(r.cliente);
  return `<div class="recrow ${r.hecho ? 'hecho' : ''}" data-rec="${r.id}"><button class="check" data-hecho title="${r.hecho ? 'Marcar como pendiente' : 'Marcar como hecho'}">${r.hecho ? '✓' : ''}</button>
    <div style="flex:1;min-width:0"><div class="txt">${esc(r.texto)}</div><div style="margin-top:4px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">${r.hecho ? '<span class="tag">Hecho</span>' : cuandoTxt(r.fecha)}${conCliente && c ? `<a href="#clientes" data-ficha="${c.id}" class="link"><span class="cod">${c.codigo}</span> ${esc(c.nombre)}</a>` : ''}</div></div>
    <button class="x" data-borrarrec title="Borrar">✕</button></div>`;
}
function bindRecs(box, rerender) {
  box.querySelectorAll('[data-rec]').forEach(el => {
    const r = S.recordatorios.find(x => x.id === el.dataset.rec);
    el.querySelector('[data-hecho]').onclick = () => { r.hecho = !r.hecho; guardar(); rerender(); if (r.hecho) toast('Hecho ✓', () => { r.hecho = false; guardar(); rerender(); }); };
    el.querySelector('[data-borrarrec]').onclick = () => { S.recordatorios = S.recordatorios.filter(x => x !== r); guardar(); rerender(); toast('Recordatorio borrado', () => { S.recordatorios.push(r); guardar(); rerender(); }); };
  });
  box.querySelectorAll('[data-ficha]').forEach(a => a.onclick = e => { e.preventDefault(); abrirFicha(a.dataset.ficha); });
}
function nuevoRecordatorio(cid, despues) {
  const m = modal(`<h2>📌 Nuevo recordatorio</h2>
    <label class="campo">¿Qué hay que hacer?</label><input type="text" id="rT" placeholder="Ej: llamar para cobrar, pasa a pagar el viernes…">
    ${cid ? `<p class="muted" style="margin:10px 0 0">Para: <b>${esc(cli(cid).nombre)}</b></p>` : `<label class="campo" style="margin-top:12px">Cliente (opcional)</label><div class="buscador"><input type="search" id="rC" placeholder="Código o nombre…" autocomplete="off"><div id="rCs"></div></div>`}
    <label class="campo" style="margin-top:12px">¿Cuándo?</label>
    <div class="chips" id="rQ">${[['Hoy',0],['Mañana',1],['En 3 días',3],['En 1 semana',7],['En 1 mes',30]].map(([t, d]) => `<button class="chip ${d === 1 ? 'on' : ''}" data-d="${d}">${t}</button>`).join('')}</div>
    <input type="date" id="rF" value="${addDays(hoy(), 1)}" style="margin-top:10px">
    <div class="fila" style="margin-top:18px"><button class="btn" id="rNo">Cancelar</button><button class="btn prim" id="rSi">Guardar recordatorio</button></div>`);
  let sel = cid || '';
  m.querySelector('#rT').focus();
  m.querySelectorAll('#rQ [data-d]').forEach(b => b.onclick = () => { m.querySelector('#rF').value = addDays(hoy(), num(b.dataset.d)); m.querySelectorAll('#rQ .chip').forEach(x => x.classList.toggle('on', x === b)); });
  m.querySelector('#rF').onchange = () => m.querySelectorAll('#rQ .chip').forEach(x => x.classList.remove('on'));
  const rc = m.querySelector('#rC');
  if (rc) rc.oninput = () => {
    sel = '';
    const res = buscarClientes(rc.value, 5);
    m.querySelector('#rCs').innerHTML = res.length ? '<div class="sugerencias">' + res.map(c => `<div class="sug" data-id="${c.id}"><span class="cod">${c.codigo}</span> <b>${esc(c.nombre)}</b><small>${esc(c.dir || '')}</small></div>`).join('') + '</div>' : '';
    m.querySelectorAll('#rCs .sug').forEach(el => el.onclick = () => { sel = el.dataset.id; rc.value = cli(sel).nombre; m.querySelector('#rCs').innerHTML = ''; });
  };
  m.querySelector('#rNo').onclick = cerrarModal;
  m.querySelector('#rSi').onclick = () => {
    const t = m.querySelector('#rT').value.trim();
    if (!t) return m.querySelector('#rT').focus();
    S.recordatorios.push({id:nid(), fecha:m.querySelector('#rF').value || hoy(), cliente:sel, texto:t, hecho:false});
    guardar(); cerrarModal(); despues && despues(); toast('Recordatorio guardado 📌');
  };
}

function iRec() {
  const lim = addDays(hoy(), 3);
  const recs = S.recordatorios.filter(r => !r.hecho && r.fecha <= lim).sort((a, b) => a.fecha.localeCompare(b.fecha));
  const prox = S.recordatorios.filter(r => !r.hecho && r.fecha > lim).length;
  const exc = S.clientes.filter(c => num(c.limite) > 0 && saldoCliente(c.id) > num(c.limite));
  $('#iRec').innerHTML = `<div class="seccion-tit"><h2>📌 Recordatorios y avisos</h2><button class="btn chico" id="iNuevoRec">+ Recordatorio</button></div>` +
    (recs.length || exc.length ? recs.map(r => filaRec(r, true)).join('') +
      exc.map(c => `<div class="recrow alerta"><span style="font-size:20px">⚠️</span><div style="flex:1"><b>${esc(c.nombre)}</b> pasó su límite de crédito: debe ${money(saldoCliente(c.id))} (límite ${money(c.limite)})</div><a href="#clientes" class="btn chico" data-ficha="${c.id}">Ver cuenta</a></div>`).join('')
      : '<div class="vacio">No hay nada pendiente para estos días. 🎉</div>') +
    (prox ? `<p class="muted" style="font-size:13px;margin:10px 0 0">Y ${prox} recordatorio${prox > 1 ? 's' : ''} más para después.</p>` : '');
  bindRecs($('#iRec'), iRec);

}

}

const V = { fecha: hoy(), chofer: '', cliente: null, cant: {}, precios: {}, pago: 'Efectivo', montos: {}, cheque: {}, env: 0, envTocado: false, q: '', sel: 0 };

      </div>

}

function vCliente() {
  const box = $('#vCliente');
  if (V.cliente) {
    const c = cli(V.cliente), s = saldoCliente(c.id);
    const recs = S.recordatorios.filter(r => !r.hecho && r.cliente === c.id);
    const ult = ventasOk().filter(v => v.cliente === c.id).sort((a, b) => b.fecha.localeCompare(a.fecha) || b.nro - a.nro)[0];
    box.innerHTML = `<div class="cliente-sel"><div style="min-width:0"><div><span class="cod">${c.codigo}</span> <b>${esc(c.nombre)}</b> ${tagCat(c)}</div>
        <div class="muted" style="font-size:14px">${esc(c.dir || '')}${c.tel ? ' · ' + esc(c.tel) : ''}</div>
        ${s > 0 ? `<div class="deuda" style="margin-top:4px">Debe ${money(s)}${num(c.limite) && s > num(c.limite) ? ' · ⚠️ pasó su límite' : ''}</div>` : ''}
        ${recs.map(r => `<div class="rec">📌 ${esc(r.texto)} · ${cuandoTxt(r.fecha)}</div>`).join('')}</div>
      <div style="display:flex;flex-direction:column;gap:6px">${s > 0 ? '<button class="btn chico" id="cliCobrar">💵 Cobrar</button>' : ''}<button class="btn chico" id="cliCambiar">Cambiar</button></div></div>
      ${ult ? `<button class="btn chico" id="vRepetir" style="margin-top:8px;width:100%;justify-content:flex-start">↻ Igual que la última vez: ${esc(detalle(ult))} <span class="muted">(${esc(fmtFecha(ult.fecha))})</span></button>` : ''}`;
    $('#cliCambiar').onclick = () => { V.cliente = null; V.q = ''; V.precios = {}; vCliente(); vProds(); vPie(); $('#cliQ').focus(); };
    if ($('#cliCobrar')) $('#cliCobrar').onclick = () => registrarCobro(c.id, () => { vCliente(); vPie(); });
    if (ult) $('#vRepetir').onclick = () => {
      V.cant = {}; ult.items.forEach(it => { if (prod(it.p)) V.cant[it.p] = it.c; });
      V.pago = [...MEDIOS, 'CtaCte'].includes(ult.pago) ? ult.pago : 'Efectivo'; V.montos = {}; V.envTocado = false; V.env = envAuto(); vProds(); vPie(); $('#vGuardar').focus();
    };
    return;
  }
  box.innerHTML = `<div class="buscador"><input type="search" id="cliQ" placeholder="Código, nombre, dirección o teléfono…" autocomplete="off" value="${esc(V.q)}"><div id="cliSug"></div></div>
    <div class="muted" style="font-size:13px;margin-top:6px">Tip: escribí el código y apretá Enter. También podés buscar “belgrano 23” o parte del nombre.</div>`;
  const inp = $('#cliQ');
  inp.oninput = () => { V.q = inp.value; V.sel = 0; vSug(); };
  inp.onkeydown = e => {
    const n = $('#cliSug').querySelectorAll('.sug').length;
    if (e.key === 'ArrowDown') { e.preventDefault(); V.sel = Math.min(V.sel + 1, n - 1); vSug(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); V.sel = Math.max(V.sel - 1, 0); vSug(); }
    else if (e.key === 'Enter') { e.preventDefault(); $('#cliSug .sug.sel')?.click(); }
    else if (e.key === 'Escape') { V.q = ''; inp.value = ''; vSug(); }
  };
  vSug();
}
function vSug() {
  const box = $('#cliSug');
  if (!V.q.trim()) { box.innerHTML = ''; return; }
  const res = buscarClientes(V.q, 7);
  const items = res.map(c => { const s = saldoCliente(c.id); return `<div class="sug" data-id="${c.id}"><span class="cod">${c.codigo}</span> <b>${esc(c.nombre)}</b> ${tagCat(c)} ${s > 0 ? `<span class="deuda" style="font-size:13px">· debe ${money(s)}</span>` : ''}<small>${esc(c.dir || '')}${c.tel ? ' · ' + esc(c.tel) : ''}</small></div>`; });
  items.push(`<div class="sug nuevo" data-nuevo="1">+ Crear cliente nuevo “${esc(V.q.trim())}”</div>`);
  box.innerHTML = '<div class="sugerencias">' + items.join('') + '</div>';
  const els = box.querySelectorAll('.sug');
  if (V.sel >= els.length) V.sel = els.length - 1;
  els[V.sel]?.classList.add('sel');
  els.forEach(el => el.onmousedown = e => { e.preventDefault(); el.click(); });
  els.forEach(el => el.onclick = () => {
    if (el.dataset.nuevo) return nuevoCliente(V.q.trim(), c => elegirCliente(c.id));
    elegirCliente(el.dataset.id);
  });
}
function elegirCliente(id) {
  V.cliente = id; V.q = ''; V.precios = {};
  vCliente(); vProds(); vPie();
  $('#vProds [data-q]')?.focus();
}
function envAuto() { return S.productos.filter(p => p.envase).reduce((a, p) => a + (V.cant[p.id] || 0), 0); }
function vProds() {
  const c = cli(V.cliente);
  $('#vProds').innerHTML = '<div class="prods">' + S.productos.map(p => {
    const n = V.cant[p.id] || 0, o = origenPrecio(c, p.id), pr = precioV(p.id);
    const nota = !c ? '' : V.precios[p.id] != null && V.precios[p.id] !== o.pr ? '<span class="tag cat-esp">Precio nuevo: se guarda</span>' : o.de === 'cliente' ? '<span class="tag" style="background:#eaf6ee;color:var(--verde)">Su precio</span>' : '<span class="tag" style="background:#fff3c4">Sin precio: revisá</span>';
    return `<div class="prod ${n ? 'on' : ''}" data-card="${p.id}"><div class="n">${esc(p.nombre)}</div>
      <div class="p"><label class="precio-ed">$ <input type="number" data-pr="${p.id}" value="${pr}" inputmode="numeric" aria-label="Precio ${esc(p.nombre)}" tabindex="-1"></label><div class="nota-pr">${nota}</div></div>
      <div class="stepper"><button data-p="${p.id}" data-d="-1" aria-label="Restar" tabindex="-1">−</button><input class="c" data-q="${p.id}" value="${n || ''}" placeholder="0" inputmode="numeric" aria-label="Cantidad ${esc(p.nombre)}"><button data-p="${p.id}" data-d="1" aria-label="Sumar" tabindex="-1">+</button></div></div>`;
  }).join('') + '</div>';
  $('#vProds').querySelectorAll('button').forEach(b => b.onclick = () => {

function cargarSheetJS() {
  return new Promise((ok, mal) => {
    if (window.XLSX) return ok();
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload = ok; s.onerror = () => mal(new Error('no se pudo cargar el lector de Excel'));

}
function elegirArchivo() {
  const i = document.createElement('input');

  i.onchange = () => i.files[0] && leerArchivo(i.files[0]);
  i.click();
}
async function leerArchivo(f) {
  toast('Leyendo ' + f.name + '…');
  try {
    await cargarSheetJS();
    const buf = await f.arrayBuffer();
    let wb;
    if (/\.(csv|txt)$/i.test(f.name)) {
      let txt; try { txt = new TextDecoder('utf-8', {fatal:true}).decode(buf); } catch (e) { txt = new TextDecoder('windows-1252').decode(buf); }
      wb = XLSX.read(txt.replace(/^\uFEFF/, ''), {type:'string'});
    } else wb = XLSX.read(buf, {type:'array'});
    const hojas = wb.SheetNames.map(n => ({n, rows: XLSX.utils.sheet_to_json(wb.Sheets[n], {header:1, defval:'', raw:false})}))
      .filter(h => h.rows.length);
    if (!hojas.length) return toast('El archivo está vacío');
    hojas.sort((a, b) => b.rows.length - a.rows.length);
    mapeoImport(hojas, 0, f.name);
  } catch (e) { toast('No pude leer el archivo: ' + e.message); }
}
const CAMPOS_IMP = [

  ['dir', 'Dirección (calle)', /direc|domic|calle/],
  ['num', 'Número / altura', /^n[uú]m|^nro\.?$|altura|^n[°º]$/],
  ['loc', 'Localidad', /local|ciudad|barrio/],
  ['tel', 'Teléfono', /tel|cel|whats|m[oó]vil/],
  ['saldo', 'Saldo / deuda', /saldo|deuda|debe/],

function detectarCabecera(rows) {
  for (let r = 0; r < Math.min(15, rows.length); r++) {
    const cells = rows[r].map(x => norm(x).trim());
    if (CAMPOS_IMP.filter(([, , re]) => cells.some(c => re.test(c))).length >= 2) return r;
  }

}

}

    <div id="iPrev" class="scroll"></div>

const STOP = new Set(['de','del','la','las','los','el','y','e','sr','sra','srta','don','dona','sa','srl','sas','flia','familia']);
const claveNombre = n => norm(n).replace(/[^a-z0-9 ]/g, ' ').split(/\s+/).filter(t => t && !STOP.has(t)).sort().join(' ');

// Devuelve las claves de una dirección: "última palabra de la calle + número".
// Entiende el formato del sistema viejo "Calle 153 AYACUCHO5756" (número pegado y a veces un 0 de más al final).
function clavesDir(d) {
  let x = norm(d).replace(/^(calle|avenida|pasaje|bulevar)\s+\d+(\s+\d\/\d)?\s+/, '').replace(/([a-z])(\d)/g, '$1 $2').replace(/[.,°º#\/\-()]/g, ' ');

  const sig = cs.map((c, i) => new Set(kN[i].split(' ').filter(t => t.length >= 3 && !/^\d+$/.test(t) && !GENERICOS.has(t))));
  const parecido = (i, j) => [...sig[i]].some(t => sig[j].has(t));
  const ign = new Set(S.noDup || []), dirOk = new Set(S.dirOk || []);
  const pk = (i, j) => [cs[i].id, cs[j].id].sort().join('|');
  const idx = (lists) => { const m = new Map(); lists.forEach((ks, i) => ks.forEach(k => { if (k) { if (!m.has(k)) m.set(k, []); m.get(k).push(i); } })); return m; };
  const mD = idx(kDs), mT = idx(kT.map(k => [k])), mN = idx(kN.map(k => [k])), mC = idx(cs.map(c => /^\d+$/.test(String(c.codigo)) ? [String(c.codigo)] : []));
  const link = (arr, cond) => { for (let a = 0; a < arr.length; a++) for (let b = a + 1; b < arr.length; b++) { const i = arr[a], j = arr[b]; if (!ign.has(pk(i, j)) && (!cond || cond(i, j))) unir(i, j); } };
  mD.forEach(a => { if (a.length > 1 && a.length < 60) link(a, parecido); });          // misma dirección y nombre parecido
  mT.forEach(a => { if (a.length > 1 && a.length < 15) link(a, parecido); });          // mismo teléfono y nombre parecido
  mN.forEach((a, k) => { if (a.length > 1 && a.length < 8 && k.split(' ').length >= 2 && !k.split(' ').some(t => GENERICOS.has(t))) link(a); }); // mismo nombre completo
  mC.forEach(a => { if (a.length > 1) link(a); });                                      // mismo código
  const g = new Map(); cs.forEach((c, i) => { const r = find(i); if (!g.has(r)) g.set(r, []); g.get(r).push(i); });

const G = { fecha: hoy(), tipo: 'Combustible' };
function vistaGastos() {

function ultimoKm(vid, antesDe) {
  return S.gastos.filter(g => g.veh === vid && num(g.odo) > 0 && (!antesDe || g.fecha <= antesDe)).sort((a, b) => a.fecha.localeCompare(b.fecha) || num(a.odo) - num(b.odo)).pop();
}
function gOdoUlt() {
  const box = $('#gOdoUlt'), vid = $('#gVeh').value;
  $('#gOdoBox').style.display = vid ? '' : 'none';
  const u = vid && ultimoKm(vid);
  box.textContent = u ? `Última carga: ${num(u.odo).toLocaleString('es-AR')} km (${fmtFecha(u.fecha)})` : vid ? 'Todavía no hay kilometraje cargado para este vehículo.' : '';
}
// Estadísticas de un vehículo entre dos fechas (método tanque a tanque)
function statsVeh(vid, desde, hasta) {
  const lect = S.gastos.filter(g => g.veh === vid && num(g.odo) > 0 && g.fecha <= hasta)
    .sort((a, b) => a.fecha.localeCompare(b.fecha) || num(a.odo) - num(b.odo));
  const antes = lect.filter(g => g.fecha < desde).pop(), dentro = lect.filter(g => g.fecha >= desde);
  const ini = antes || dentro[0], fin = dentro[dentro.length - 1];
  const km = ini && fin ? num(fin.odo) - num(ini.odo) : 0;
  // litros cargados después de la lectura inicial y hasta la final
  const iIni = lect.indexOf(ini), iFin = lect.indexOf(fin);
  const litros = km > 0 ? lect.slice(iIni + 1, iFin + 1).reduce((a, g) => a + num(g.litros), 0) : 0;
  const gs = S.gastos.filter(g => g.veh === vid && g.fecha >= desde && g.fecha <= hasta);
  const suma = (l, t) => l.filter(g => (g.tipo === 'Combustible') === t).reduce((a, g) => a + g.monto, 0);
  const comb = suma(gs, true), otros = suma(gs, false);
  // para el costo por km: si no hay lectura previa, no cuentan los gastos anteriores a la primera lectura ni esa carga
  // y tampoco los posteriores a la última lectura (todavía no tienen km)
  const gk = (antes || !ini ? gs : gs.filter(g => g !== ini && g.fecha >= ini.fecha)).filter(g => !fin || g.fecha <= fin.fecha);
  const combK = suma(gk, true), otrosK = suma(gk, false);
  return {km, litros, comb, otros, total: comb + otros, ultimo: lect[lect.length - 1],
    kmL: km > 0 && litros > 0 ? km / litros : 0, xKm: km > 0 ? (combK + otrosK) / km : 0, combKm: km > 0 ? combK / km : 0};
}
const fmt1 = n => n.toLocaleString('es-AR', {maximumFractionDigits:1});
function gKm() {
  const m = mesDe(G.fecha), ini = m + '-01', fin = m + '-31';
  const tarjetas = S.vehiculos.map(v => {
    const h = statsVeh(v.id, '0000-01-01', '9999-12-31'), mes = statsVeh(v.id, ini, fin), u = h.ultimo;
    return `<div class="veh">
      <div class="veh-tit"><b>🚚 ${esc(v.nombre)}</b><span class="tag">${esc(nombreMes(m))}</span></div>
      <div class="veh-odo">${u ? num(u.odo).toLocaleString('es-AR') + ' km' : '— km'}</div>
      <div class="muted" style="font-size:13px;margin-top:-2px">${u ? 'Marca el tablero (cargado el ' + esc(fmtFecha(u.fecha)) + ')' : 'Todavía no se cargó el kilometraje'}</div>
      <div class="veh-datos">
        <div><span>Rinde (promedio)</span><b>${h.kmL ? fmt1(h.kmL) + ' km/L' : '—'}</b><small>${mes.kmL ? 'este mes ' + fmt1(mes.kmL) + ' km/L' : 'promedio'}</small></div>
        <div><span>Cada km cuesta (promedio)</span><b>${h.xKm ? money(h.xKm) : '—'}</b><small>${h.combKm ? 'combustible ' + money(h.combKm) : 'promedio'}</small></div>
        <div><span>Este mes</span><b>${mes.km ? mes.km.toLocaleString('es-AR') + ' km' : '—'}</b><small>${mes.xKm ? money(mes.xKm) + ' por km' : 'sin km este mes'}</small></div>
        <div><span>Gastos del mes</span><b>${money(mes.total)}</b><small>combustible ${money(mes.comb)}</small></div>
      </div></div>`;
  }).join('');
  $('#gKm').innerHTML = `<div class="seccion-tit"><h2>🚚 Kilometraje, rendimiento y costo por km</h2></div>
    ${S.vehiculos.length ? `<div class="vehs">${tarjetas}</div>` : '<div class="vacio">No hay vehículos cargados. Agregalos en <a href="#datos">Datos</a>.</div>'}
    <p class="muted" style="font-size:13px;margin-bottom:0"><b>Rinde</b> = km recorridos ÷ litros cargados (promedio de todo lo cargado). <b>Cada km cuesta</b> = todos los gastos del vehículo (combustible, arreglos, peajes…) ÷ km recorridos. Se calcula con el kilometraje del tablero que se pone al cargar combustible o con “Solo kilometraje”. Los vehículos se agregan en <a href="#datos">Datos</a>.</p>`;
}
function gTipos() {
  $('#gTipos').innerHTML = TIPOS_GASTO.map(t => `<button class="chip ${G.tipo === t ? 'on' : ''}" data-t="${t}">${t}</button>`).join('');
  $('#gTipos').querySelectorAll('[data-t]').forEach(b => b.onclick = () => { G.tipo = b.dataset.t; gTipos(); });
  $('#gLitrosBox').style.display = G.tipo === 'Combustible' ? '' : 'none';
  $('#gMontoBox').style.display = G.tipo === 'Solo kilometraje' ? 'none' : '';
}
function guardarGasto() {
  const soloKm = G.tipo === 'Solo kilometraje', monto = soloKm ? 0 : Number($('#gMonto').value), odo = num($('#gOdo').value), vid = $('#gVeh').value;
  if (soloKm && (!vid || !odo)) { toast('Elegí el vehículo y poné el kilometraje'); $('#gOdo').focus(); return; }
  if (!soloKm && !(monto > 0)) { toast('Poné el monto del gasto'); $('#gMonto').focus(); return; }
  const u = odo && ultimoKm(vid, G.fecha);
  if (u && odo < num(u.odo)) { toast(`Ojo: el kilometraje es menor que el último cargado (${num(u.odo).toLocaleString('es-AR')} km). Revisalo.`); $('#gOdo').focus(); return; }
  if (u && odo - num(u.odo) > 3000 && !G.okSalto) {
    return confirmar(`Son ${(odo - num(u.odo)).toLocaleString('es-AR')} km desde la última carga (${fmtFecha(u.fecha)}). ¿Está bien el número?`, 'Sí, está bien', () => { G.okSalto = true; guardarGasto(); G.okSalto = false; });
  }
  const g = {id:nid(), fecha:G.fecha, tipo:G.tipo, veh:vid, chofer:$('#gChofer').value,
    litros: G.tipo === 'Combustible' ? Number($('#gLitros').value) || 0 : 0, monto, odo: odo || 0, nota:$('#gNota').value.trim()};
  S.gastos.push(g); guardar();
  $('#gMonto').value = ''; $('#gLitros').value = ''; $('#gNota').value = ''; $('#gOdo').value = '';
  gLista(); gKm(); gOdoUlt();
  toast(soloKm ? 'Kilometraje guardado' : 'Gasto guardado: ' + g.tipo + ' — ' + money(monto), () => { S.gastos = S.gastos.filter(x => x.id !== g.id); guardar(); gLista(); gKm(); gOdoUlt(); });
}
function gLista() {
  const m = mesDe(G.fecha);
  const lista = S.gastos.filter(g => mesDe(g.fecha) === m).sort((a, b) => b.fecha.localeCompare(a.fecha));
  const porTipo = {};
  lista.forEach(g => porTipo[g.tipo] = (porTipo[g.tipo] || 0) + g.monto);
  const litros = lista.reduce((a, g) => a + (g.litros || 0), 0);
  $('#gLista').innerHTML = `<div class="seccion-tit"><h2>Gastos de ${esc(nombreMes(m))}</h2><span class="tag">${money(lista.reduce((a, g) => a + g.monto, 0))}</span></div>
    <div class="chips" style="margin-bottom:14px">${Object.entries(porTipo).map(([t, v]) => `<span class="tag">${esc(t)}: ${money(v)}</span>`).join('')}${litros ? `<span class="tag">⛽ ${litros.toLocaleString('es-AR')} litros</span>` : ''}</div>` +
    (lista.length ? `<table class="tabla"><thead><tr><th>Fecha</th><th>Gasto</th><th class="num">Monto</th><th></th></tr></thead><tbody>` +
      lista.map(g => `<tr><td>${esc(fmtFecha(g.fecha))}</td><td><b>${esc(g.tipo)}</b>${g.litros ? ' · ' + g.litros + ' L' : ''}${num(g.odo) ? ' · ' + num(g.odo).toLocaleString('es-AR') + ' km' : ''}<div class="muted" style="font-size:13px">${esc([veh(g.veh)?.nombre, emp(g.chofer)?.nombre, g.nota].filter(Boolean).join(' · '))}</div></td><td class="num"><b>${g.monto ? money(g.monto) : '—'}</b></td><td><button class="x" data-borrar="${g.id}" title="Borrar gasto">✕</button></td></tr>`).join('') +
      '</tbody></table>' : '<div class="vacio">No hay gastos cargados este mes.</div>');
  $('#gLista').querySelectorAll('[data-borrar]').forEach(b => b.onclick = () => {
    const g = S.gastos.find(x => x.id === b.dataset.borrar);
    S.gastos = S.gastos.filter(x => x !== g); guardar(); gLista(); gKm();
    toast('Gasto borrado', () => { S.gastos.push(g); guardar(); gLista(); gKm(); });
  });
}

/* ===================== RESUMEN ===================== */
const R = { per: 'mes', desde: hoy(), hasta: hoy() };
function rango() {
  const f = hoy(), d = new Date(f + 'T12:00:00');
  if (R.per === 'hoy') return [f, f];
  if (R.per === 'semana') { const dow = (d.getDay() + 6) % 7; return [addDays(f, -dow), f]; }
  if (R.per === 'mes') return [mesDe(f) + '-01', f];
  if (R.per === 'mesPasado') { const p = new Date(d.getFullYear(), d.getMonth() - 1, 1); const u = new Date(d.getFullYear(), d.getMonth(), 0); return [ymd(p), ymd(u)]; }
  return [R.desde, R.hasta];
}
function vistaResumen() {
  const [desde, hasta] = rango();
  const enR = x => x.fecha >= desde && x.fecha <= hasta;
  const cobr = S.cobros.filter(x => !x.anulado && enR(x));
  const vs = ventasOk().filter(enR), gs = S.gastos.filter(enR), hs = S.horas.filter(enR);
  const totV = vs.reduce((a, v) => a + v.total, 0), totG = gs.reduce((a, g) => a + g.monto, 0);
  const porProd = {}, porPago = {}, porCli = {}, porTipo = {};

    v.items.forEach(it => { const o = porProd[it.p] ||= {c:0, t:0, co:0}; o.c += it.c; o.t += it.c * it.pr; o.co += it.c * (it.co ?? num(prod(it.p)?.costo)); });
    pagosDe(v).forEach(x => porPago[x.medio] = (porPago[x.medio] || 0) + x.monto);
    if (ccDe(v) > 0) porPago.CtaCte = (porPago.CtaCte || 0) + ccDe(v);
    const o = porCli[v.cliente] ||= {n:0, t:0}; o.n++; o.t += v.total;
  });
  gs.forEach(g => porTipo[g.tipo] = (porTipo[g.tipo] || 0) + g.monto);
  const garrafas = Object.entries(porProd).filter(([p]) => prod(p)?.envase).reduce((a, [, o]) => a + o.c, 0);
  const horas = hs.reduce((a, h) => a + horasEntre(h.entrada, h.salida), 0);
  const per = [['hoy','Hoy'],['semana','Esta semana'],['mes','Este mes'],['mesPasado','Mes pasado'],['otro','Elegir fechas']];
  const top = Object.entries(porCli).sort((a, b) => b[1].t - a[1].t).slice(0, 10);
  $('#main').innerHTML = `
    <h1>Resumen</h1>
    <p class="sub">Del ${esc(fmtFecha(desde))} al ${esc(fmtFecha(hasta))}</p>
    <div class="card">
      <div class="chips" id="rPer">${per.map(([k, t]) => `<button class="chip ${R.per === k ? 'on' : ''}" data-p="${k}">${t}</button>`).join('')}</div>
      ${R.per === 'otro' ? `<div class="fila" style="margin-top:14px;max-width:460px"><div><label class="campo">Desde</label><input type="date" id="rD" value="${R.desde}"></div><div><label class="campo">Hasta</label><input type="date" id="rH" value="${R.hasta}"></div></div>` : ''}
    </div>
    <div class="kpis">
      <div class="kpi dest"><div class="k">Total vendido</div><div class="v">${money(totV)}</div></div>
      <div class="kpi"><div class="k">Ganancia (ventas − costo de lo vendido)</div><div class="v" style="color:var(--verde)">${money(totV - Object.values(porProd).reduce((a, o) => a + o.co, 0))}</div></div>
      <div class="kpi"><div class="k">Gastos</div><div class="v">${money(totG)}</div></div>
      <div class="kpi"><div class="k">Ventas menos gastos</div><div class="v" style="color:${totV - totG >= 0 ? 'var(--verde)' : 'var(--rojo)'}">${money(totV - totG)}</div></div>
      <div class="kpi"><div class="k">Garrafas entregadas</div><div class="v">${garrafas}</div></div>
      <div class="kpi"><div class="k">Cobrado de cuentas corrientes</div><div class="v">${money(cobr.reduce((a, x) => a + x.monto, 0))}</div></div>
      <div class="kpi"><div class="k">Horas trabajadas</div><div class="v">${Math.round(horas)} h</div></div>
    </div>
    <div class="grid2">
      <div>
        <div class="card"><h2>Por producto</h2>${tablaSimple(['Producto','Unidades','Vendido','Costo','Ganancia'], S.productos.filter(p => porProd[p.id]).map(p => [esc(p.nombre), porProd[p.id].c, money(porProd[p.id].t), money(porProd[p.id].co), money(porProd[p.id].t - porProd[p.id].co)]), ['', sumar(Object.values(porProd), 'c'), money(totV), money(sumar(Object.values(porProd), 'co')), money(totV - sumar(Object.values(porProd), 'co'))])}</div>
        <div class="card"><h2>Clientes que más compraron</h2>${tablaSimple(['Cliente','Compras','Total'], top.map(([id, o]) => [(cli(id) ? `<span class="cod">${cli(id).codigo}</span> ` : '') + esc(cli(id)?.nombre || '—'), o.n, money(o.t)]))}</div>
      </div>
      <div>
        <div class="card"><h2>Por forma de pago</h2>${tablaSimple(['Forma de pago','Total'], Object.entries(porPago).map(([p, t]) => [`<span class="tag ${p}">${pagoTxt(p)}</span>`, money(t)]))}</div>
        <div class="card"><h2>🧾 Cheques recibidos</h2>${tablaSimple(['Cliente','N° / banco','Cobrar el','Monto'], vs.flatMap(v => pagosDe(v).filter(x => x.cheque).map(x => [v, x.cheque, x.monto])).concat(cobr.filter(x => x.cheque).map(x => [x, x.cheque, x.monto])).sort((a, b) => String(a[1].fecha).localeCompare(String(b[1].fecha))).map(([o, ch, m]) => [esc(cli(o.cliente)?.nombre || '—'), esc([ch.nro, ch.banco].filter(Boolean).join(' · ') || '—'), ch.fecha ? esc(fmtFecha(ch.fecha)) : '—', money(m)]))}</div>
        <div class="card"><h2>Gastos por tipo</h2>${tablaSimple(['Tipo','Total'], Object.entries(porTipo).sort((a, b) => b[1] - a[1]).map(([t, v]) => [esc(t), money(v)]), ['', money(totG)])}</div>
        <div class="card"><h2>Pasar a Excel</h2><p class="muted" style="margin-top:0">Copia las ventas del período para pegarlas en una planilla de Excel.</p><button class="btn prim" id="rCopiar">📋 Copiar ventas para Excel</button></div>
      </div>
    </div>`;
  $('#rPer').querySelectorAll('[data-p]').forEach(b => b.onclick = () => { R.per = b.dataset.p; if (R.per === 'otro') { R.desde = desde; R.hasta = hasta; } vistaResumen(); });
  if ($('#rD')) { $('#rD').onchange = e => { R.desde = e.target.value; vistaResumen(); }; $('#rH').onchange = e => { R.hasta = e.target.value; vistaResumen(); }; }
  $('#rCopiar').onclick = () => copiarExcel(vs);
}
const sumar = (arr, k) => arr.reduce((a, o) => a + o[k], 0);
function tablaSimple(cab, filas, pie) {
  if (!filas.length) return '<div class="vacio">Sin datos en este período.</div>';
  const td = (v, i) => `<td class="${i ? 'num' : ''}">${v}</td>`;
  return `<table class="tabla"><thead><tr>${cab.map((c, i) => `<th class="${i ? 'num' : ''}">${c}</th>`).join('')}</tr></thead><tbody>` +
    filas.map(f => '<tr>' + f.map(td).join('') + '</tr>').join('') + '</tbody>' +
    (pie ? '<tfoot><tr><td>Total</td>' + pie.slice(1).map((v, i) => td(v, i + 1)).join('') + '</tr></tfoot>' : '') + '</table>';
}
function copiarExcel(vs) {
  const filas = [['Fecha','N° venta','Código','Cliente','Detalle','Forma de pago','Envases devueltos','Chofer','Total']]
    .concat(vs.slice().sort((a, b) => a.fecha.localeCompare(b.fecha)).map(v => [v.fecha.split('-').reverse().join('/'), v.nro, cli(v.cliente)?.codigo || '', cli(v.cliente)?.nombre || '', detalle(v), pagosTxt(v) || pagoTxt(v.pago), v.env, emp(v.chofer)?.nombre || 'Depósito', v.total]));
  copiarTexto(filas.map(f => f.join('\t')).join('\n'), 'Copiadas ' + vs.length + ' ventas. Pegalas en Excel con Ctrl+V');
}

    toast('Factura guardada — ' + money(reg.total), () => { S.compras = S.compras.filter(x => x !== reg); guardar(); vistaProveedor(); });
  };
  $('#pGuardar').onclick = () => {
    const monto = num($('#pMonto').value);
    if (!(monto > 0)) { toast('Poné el monto del pago'); $('#pMonto').focus(); return; }
    const reg = {id:nid(), fecha:$('#pFecha').value || hoy(), tipo:P.tipoPago, monto, ref:$('#pRef').value.trim()};
    S.pagos.push(reg); guardar(); P.mes = mesDe(reg.fecha); vistaProveedor();
    toast('Pago guardado — ' + money(monto), () => { S.pagos = S.pagos.filter(x => x !== reg); guardar(); vistaProveedor(); });
  };
  document.querySelectorAll('[data-pv]').forEach(i => i.onchange = () => { const k = i.dataset.pv; pv[k] = k === 'nombre' ? i.value.trim() : num(i.value); guardar(); vistaProveedor(); toast('Guardado'); });
  document.querySelectorAll('[data-precio]').forEach(i => i.onchange = () => { pv.precios[i.dataset.precio] = num(i.value); guardar(); cCalc(); toast('Precio actualizado (se usa en las facturas nuevas)'); });
}
function cCalc() {
  const pv = S.proveedor, c = calcCompra(P.q, pv.precios, pv.impuesto);
  $('#cCalc').innerHTML = `<div><span class="muted">Neto sin impuestos</span><span>${money(c.neto)}</span></div>
    <div><span class="muted">IVA + percepciones (${pv.impuesto}%)</span><span>${money(c.impuestos)}</span></div>
    <div><span class="muted">Kilos</span><span>${c.butano.toLocaleString('es-AR')} kg butano · ${c.propano.toLocaleString('es-AR')} kg propano</span></div>
    <div class="tot"><span>Total factura</span><span>${money(c.total)}</span></div>`;
}
function pTipos() {
  $('#pTipos').innerHTML = TIPOS_PAGO.map(t => `<button class="chip ${P.tipoPago === t ? 'on' : ''}" data-t="${t}">${t}</button>`).join('');
  $('#pTipos').querySelectorAll('[data-t]').forEach(b => b.onclick = () => { P.tipoPago = b.dataset.t; pTipos(); });
}
function cuenta() {
  const m = P.mes, ini = saldoProveedor(m + '-01');
  const movs = S.compras.filter(c => mesDe(c.fecha) === m).map(c => ({f:c.fecha, tipo:'c', o:c}))
    .concat(S.pagos.filter(p => mesDe(p.fecha) === m).map(p => ({f:p.fecha, tipo:'p', o:p})))
    .sort((a, b) => a.f.localeCompare(b.f) || (a.tipo === 'c' ? -1 : 1));
  let saldo = ini;
  const filas = movs.map(x => {
    const c = x.o;
    if (x.tipo === 'c') saldo += c.total; else saldo -= c.monto;
    const concepto = x.tipo === 'c'
      ? `<b>Factura${c.nro ? ' ' + esc(c.nro) : ''}</b><div class="muted" style="font-size:13px">${ENV.filter(e => num(c.q[e.k])).map(e => c.q[e.k] + ' × ' + e.t).join(', ')}</div>`
      : `<b>${esc(c.tipo)}</b>${c.ref ? '<div class="muted" style="font-size:13px">' + esc(c.ref) + '</div>' : ''}`;
    return `<tr><td>${esc(fmtFecha(x.f))}</td><td>${concepto}</td><td class="num debe">${x.tipo === 'c' ? money(c.total) : ''}</td><td class="num haber">${x.tipo === 'p' ? money(c.monto) : ''}</td><td class="num"><b>${money(saldo)}</b></td><td><button class="x" data-b="${x.tipo}:${c.id}" title="Borrar">✕</button></td></tr>`;
  });
  $('#cuenta').innerHTML = `<div class="seccion-tit"><h2>Cuenta corriente</h2>
      <div class="mesnav"><button class="btn chico" id="mAnt">◀</button><b>${esc(nombreMes(m).replace(/^./, c => c.toUpperCase()))}</b><button class="btn chico" id="mSig">▶</button></div></div>
    <div class="scroll"><table class="tabla cuenta"><thead><tr><th>Fecha</th><th>Concepto</th><th class="num">Factura (debe)</th><th class="num">Pago (haber)</th><th class="num">Saldo</th><th></th></tr></thead><tbody>
      <tr><td></td><td class="muted">Saldo al inicio del mes</td><td></td><td></td><td class="num"><b>${money(ini)}</b></td><td></td></tr>
      ${filas.join('') || '<tr><td colspan="6" class="vacio">No hay movimientos este mes.</td></tr>'}
    </tbody><tfoot><tr><td></td><td>Saldo al final del mes</td><td class="num">${money(movs.filter(x => x.tipo === 'c').reduce((a, x) => a + x.o.total, 0))}</td><td class="num">${money(movs.filter(x => x.tipo === 'p').reduce((a, x) => a + x.o.monto, 0))}</td><td class="num">${money(saldo)}</td><td></td></tr></tfoot></table></div>`;
  $('#mAnt').onclick = () => { P.mes = mesMas(P.mes, -1); cuenta(); };
  $('#mSig').onclick = () => { P.mes = mesMas(P.mes, 1); cuenta(); };
  $('#cuenta').querySelectorAll('[data-b]').forEach(b => b.onclick = () => {
    const [t, id] = b.dataset.b.split(':');
    const lista = t === 'c' ? 'compras' : 'pagos';
    const o = S[lista].find(x => x.id === id);
    confirmar(t === 'c' ? '¿Borrar esta factura?' : '¿Borrar este pago?', 'Sí, borrar', () => {
      S[lista] = S[lista].filter(x => x !== o); guardar(); vistaProveedor();
      toast('Borrado', () => { S[lista].push(o); guardar(); vistaProveedor(); });
    });
  });
}

/* ===================== ENVASES ===================== */
const E = { fecha: hoy() };
const COLS = ENV.flatMap(e => [e.k + 'L', e.k + 'V']);
function diaAnterior(f) { return Object.keys(S.stock).filter(d => d < f).sort().pop(); }
function vistaEnvases() {
  const dia = S.stock[E.fecha];
  const ant = diaAnterior(E.fecha);
  $('#main').innerHTML = `
    <h1>Conteo de envases</h1>
    <p class="sub">Cuántas garrafas llenas y vacías hay en cada lugar. Los totales y el control se hacen solos.</p>
    <div class="card">
      <div class="seccion-tit">
        <div class="fila" style="flex:1;max-width:620px">
          <div><label class="campo">Día del conteo</label><input type="date" id="eFecha" value="${E.fecha}"></div>
          <div style="flex:0 0 auto"><button class="btn" id="eCopiar" ${ant ? '' : 'disabled'}>📋 Copiar del ${ant ? esc(fmtFecha(ant)) : 'día anterior'}</button></div>
        </div>
        ${dia ? '<span class="badge-ok">✓ Conteo guardado</span>' : '<span class="tag">Sin cargar todavía</span>'}
      </div>
      <div class="scroll"><table class="tabla tabla-stock" id="eTabla">
        <thead><tr><th rowspan="2">Lugar</th>${ENV.map(e => `<th colspan="2" class="grupo">${e.t}</th>`).join('')}</tr>
        <tr>${ENV.map(() => '<th class="grupo ll">Llenas</th><th>Vacías</th>').join('')}</tr></thead>
        <tbody>${S.lugares.map(l => `<tr data-l="${l.id}"><td><b>${esc(l.nombre)}</b></td>${COLS.map((c, i) => `<td class="${i % 2 ? '' : 'grupo ll'}"><input type="number" min="0" inputmode="numeric" data-c="${c}" value="${dia?.[l.id]?.[c] || ''}"></td>`).join('')}</tr>`).join('')}</tbody>
        <tfoot><tr><td>Total</td>${COLS.map((c, i) => `<td class="${i % 2 ? '' : 'grupo ll'}" data-t="${c}"></td>`).join('')}</tr></tfoot>
      </table></div>
      <div style="margin-top:16px"><button class="btn prim grande" id="eGuardar">✓ Guardar conteo del día</button></div>
    </div>
    <div class="card" id="eControl"></div>
    <div class="card" id="eMd"></div>
    <div class="card" id="eDeb"></div>`;
  $('#eFecha').onchange = e => { E.fecha = e.target.value || hoy(); vistaEnvases(); };
  $('#eTabla').querySelectorAll('input').forEach(i => i.oninput = eCalc);
  $('#eCopiar').onclick = () => {
    const d = S.stock[ant];
    $('#eTabla').querySelectorAll('tr[data-l]').forEach(tr => tr.querySelectorAll('input').forEach(i => i.value = d?.[tr.dataset.l]?.[i.dataset.c] || ''));
    eCalc(); toast('Copiado. Corregí lo que cambió y guardá.');
  };
  $('#eGuardar').onclick = () => { S.stock[E.fecha] = leerConteo(); guardar(); vistaEnvases(); toast('Conteo del ' + fmtFecha(E.fecha) + ' guardado'); };
  ePrestamos('md', '#eMd', '🤝 Clientes que nos deben envases', 'Envases nuestros que tienen los clientes (comodatos / préstamos).');
  ePrestamos('deb', '#eDeb', '📤 Envases que debemos', 'Envases de otros que tenemos nosotros.');
  eCalc();
}
function leerConteo() {
  const d = {};
  $('#eTabla').querySelectorAll('tr[data-l]').forEach(tr => {
    const o = {}; tr.querySelectorAll('input').forEach(i => { if (num(i.value)) o[i.dataset.c] = num(i.value); });
    d[tr.dataset.l] = o;
  });
  return d;
}
function eCalc() {
  const d = leerConteo();
  const tot = {}; COLS.forEach(c => tot[c] = Object.values(d).reduce((a, o) => a + num(o[c]), 0));
  COLS.forEach(c => $(`#eTabla [data-t="${c}"]`).textContent = tot[c].toLocaleString('es-AR'));
  const pres = t => k => S.prestamos.filter(p => p.tipo === t).reduce((a, p) => a + num(p.q[k]), 0);
  const md = pres('md'), deb = pres('deb');
  let kgLl = 0, kgV = 0, difTot = 0;
  const filas = ENV.map(e => {
    const ll = tot[e.k + 'L'], v = tot[e.k + 'V'], fis = ll + v, total = fis + md(e.k) - deb(e.k), esp = num(S.envEsperado[e.k]), dif = total - esp;
    kgLl += ll * e.kg; kgV += v * e.kg; difTot += Math.abs(dif);
    return `<tr><td><b>${e.t}</b></td><td class="num">${ll}</td><td class="num">${v}</td><td class="num">${fis}</td><td class="num">+ ${md(e.k)}</td><td class="num">− ${deb(e.k)}</td><td class="num"><b>${total}</b></td>
      <td class="num"><input type="number" data-esp="${e.k}" value="${esp}" style="width:90px;text-align:right"></td>
      <td class="num">${dif === 0 ? '<span class="badge-ok">✓ Bien</span>' : `<span class="badge-mal">${dif < 0 ? 'Faltan ' + (-dif) : 'Sobran ' + dif}</span>`}</td></tr>`;
  });
  $('#eControl').innerHTML = `<div class="seccion-tit"><h2>Control de envases</h2>${difTot === 0 ? '<span class="badge-ok">✓ Todo cierra</span>' : '<span class="badge-mal">⚠ Hay diferencias, revisá el conteo</span>'}</div>
    <div class="kpis">
      <div class="kpi dest"><div class="k">Garrafas llenas</div><div class="v">${ENV.reduce((a, e) => a + tot[e.k + 'L'], 0).toLocaleString('es-AR')}</div></div>
      <div class="kpi"><div class="k">Garrafas vacías</div><div class="v">${ENV.reduce((a, e) => a + tot[e.k + 'V'], 0).toLocaleString('es-AR')}</div></div>
      <div class="kpi"><div class="k">Kilos de gas en llenas</div><div class="v">${kgLl.toLocaleString('es-AR')} kg</div></div>
      <div class="kpi"><div class="k">Kilos para llenar (vacías)</div><div class="v">${kgV.toLocaleString('es-AR')} kg</div></div>
    </div>
    <div class="scroll"><table class="tabla"><thead><tr><th>Envase</th><th class="num">Llenas</th><th class="num">Vacías</th><th class="num">En depósito</th><th class="num">Nos deben</th><th class="num">Debemos</th><th class="num">Total</th><th class="num">Tendría que haber</th><th class="num">Control</th></tr></thead>
    <tbody>${filas.join('')}</tbody></table></div>
    <p class="muted" style="font-size:13px;margin-bottom:0">Total = llenas + vacías + las que nos deben − las que debemos. Si no coincide con lo que tendría que haber, falta o sobra algún envase en el conteo.</p>`;
  $('#eControl').querySelectorAll('[data-esp]').forEach(i => i.onchange = () => { S.envEsperado[i.dataset.esp] = num(i.value); guardar(); eCalc(); toast('Guardado'); });
}
function ePrestamos(tipo, sel, titulo, ayuda) {
  const lista = S.prestamos.filter(p => p.tipo === tipo);
  const box = $(sel);
  box.innerHTML = `<div class="seccion-tit"><h2>${titulo}</h2><button class="btn chico" data-nuevo>+ Agregar</button></div>
    <p class="muted" style="margin-top:0;font-size:14px">${ayuda}</p>
    <div class="scroll"><table class="tabla"><thead><tr><th>Nombre</th>${ENV.map(e => `<th class="num">${e.t}</th>`).join('')}<th></th></tr></thead><tbody>
    ${lista.map(p => `<tr data-id="${p.id}"><td><input type="text" data-k="nombre" value="${esc(p.nombre)}" style="min-width:150px"></td>${ENV.map(e => `<td><input type="number" min="0" data-k="${e.k}" value="${p.q[e.k] || ''}" style="width:64px;text-align:right"></td>`).join('')}<td><button class="x" data-borrar title="Borrar">✕</button></td></tr>`).join('') || `<tr><td colspan="${ENV.length + 2}" class="vacio">No hay nada cargado.</td></tr>`}
    </tbody><tfoot><tr><td>Total</td>${ENV.map(e => `<td class="num">${lista.reduce((a, p) => a + num(p.q[e.k]), 0)}</td>`).join('')}<td></td></tr></tfoot></table></div>`;
  box.querySelectorAll('tr[data-id]').forEach(tr => {
    const p = S.prestamos.find(x => x.id === tr.dataset.id);
    tr.querySelectorAll('[data-k]').forEach(i => i.onchange = () => {
      if (i.dataset.k === 'nombre') p.nombre = i.value.trim(); else p.q[i.dataset.k] = num(i.value);
      guardar(); ePrestamos(tipo, sel, titulo, ayuda); eCalc();
    });
    tr.querySelector('[data-borrar]').onclick = () => {
      S.prestamos = S.prestamos.filter(x => x !== p); guardar(); ePrestamos(tipo, sel, titulo, ayuda); eCalc();
      toast('Borrado', () => { S.prestamos.push(p); guardar(); ePrestamos(tipo, sel, titulo, ayuda); eCalc(); });
    };
  });
  box.querySelector('[data-nuevo]').onclick = () => {
    S.prestamos.push({id:nid(), tipo, nombre:'', q:{}}); guardar(); ePrestamos(tipo, sel, titulo, ayuda);
    box.querySelector('tbody tr:last-child input')?.focus();
  };
}

/* ===================== Arranque ===================== */
const VISTAS = { inicio: vistaInicio, ventas: vistaVentas, clientes: vistaClientes, gastos: vistaGastos, horas: vistaHoras, proveedor: vistaProveedor, envases: vistaEnvases, resumen: vistaResumen, datos: vistaDatos };
ir();
</script>
</body>
</html>
